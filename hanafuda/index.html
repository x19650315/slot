<script>
// こいこい rules engine (standard rules). Pure functions; works in the browser and in Node.
(function (root) {
  "use strict";
  // ---- the 48 cards: id = (month-1)*4 + k ----
  var MONTHS = ["松", "梅", "桜", "藤", "菖蒲", "牡丹", "萩", "芒", "菊", "紅葉", "柳", "桐"];
  // kind: H=光(20) T=タネ(10) S=短冊(5) K=カス(1); tag marks cards used by named yaku
  var DEF = [
    [["H", "鶴"], ["S", "赤短"], ["K"], ["K"]],
    [["T", "鶯"], ["S", "赤短"], ["K"], ["K"]],
    [["H", "幕"], ["S", "赤短"], ["K"], ["K"]],
    [["T", "ほととぎす"], ["S", "短"], ["K"], ["K"]],
    [["T", "八橋"], ["S", "短"], ["K"], ["K"]],
    [["T", "蝶"], ["S", "青短"], ["K"], ["K"]],
    [["T", "猪"], ["S", "短"], ["K"], ["K"]],
    [["H", "月"], ["T", "雁"], ["K"], ["K"]],
    [["T", "盃"], ["S", "青短"], ["K"], ["K"]],
    [["T", "鹿"], ["S", "青短"], ["K"], ["K"]],
    [["H", "雨"], ["T", "燕"], ["S", "短"], ["K", "雷"]],
    [["H", "鳳凰"], ["K"], ["K"], ["K"]]
  ];
  var CARDS = [];
  DEF.forEach(function (row, mi) {
    row.forEach(function (d, k) { CARDS.push({ id: mi * 4 + k, m: mi + 1, kind: d[0], tag: d[1] || "", name: MONTHS[mi] + (d[1] ? "に" + d[1] : { H: "の光", T: "のタネ", S: "の短冊", K: "のカス" }[d[0]]) }); });
  });
  function card(id) { return CARDS[id]; }
  function month(id) { return (id >> 2) + 1; }
  var ID = {}; CARDS.forEach(function (c) { if (c.tag && !ID[c.tag]) ID[c.tag] = c.id; });
  var SAKE = ID["盃"], RAIN = ID["雨"], MOON = ID["月"], CURTAIN = ID["幕"];

  // ---- yaku (standard): returns [{name, pts}] and total ----
  function yaku(cap) {
    var H = [], T = 0, S = 0, K = 0, has = {}, red = 0, blue = 0, isd = 0, out = [];
    cap.forEach(function (id) {
      var c = CARDS[id]; has[id] = 1;
      if (c.kind === "H") H.push(id);
      if (c.kind === "T") T++;
      if (c.kind === "S") { S++; if (c.tag === "赤短") red++; if (c.tag === "青短") blue++; }
      if (c.kind === "K") K++;
      if (c.tag === "猪" || c.tag === "鹿" || c.tag === "蝶") isd++;
    });
    if (has[SAKE]) K++;            // the sake cup also counts as a chaff card
    var h = H.length, rain = !!has[RAIN];
    if (h === 5) out.push({ name: "五光", pts: 10 });
    else if (h === 4 && !rain) out.push({ name: "四光", pts: 8 });
    else if (h === 4) out.push({ name: "雨四光", pts: 7 });
    else if (h === 3 && !rain) out.push({ name: "三光", pts: 5 });
    if (has[SAKE] && has[CURTAIN]) out.push({ name: "花見で一杯", pts: 5 });
    if (has[SAKE] && has[MOON]) out.push({ name: "月見で一杯", pts: 5 });
    if (isd === 3) out.push({ name: "猪鹿蝶", pts: 5 });
    if (red === 3 && blue === 3) out.push({ name: "赤短・青短の重複", pts: 10 });
    else { if (red === 3) out.push({ name: "赤短", pts: 5 }); if (blue === 3) out.push({ name: "青短", pts: 5 }); }
    if (T >= 5) out.push({ name: "タネ", pts: 1 + (T - 5) });
    if (S >= 5) out.push({ name: "タン", pts: 1 + (S - 5) });
    if (K >= 10) out.push({ name: "カス", pts: 1 + (K - 10) });
    var total = out.reduce(function (a, y) { return a + y.pts; }, 0);
    return { list: out, total: total };
  }

  // ---- random ----
  function rng(seed) {   // mulberry32; seed undefined → Math.random
    if (seed == null) return Math.random;
    var a = seed >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function shuffle(r) { var d = []; for (var i = 0; i < 48; i++) d.push(i); for (var j = 47; j > 0; j--) { var k = Math.floor(r() * (j + 1)); var x = d[j]; d[j] = d[k]; d[k] = x; } return d; }

  // ---- a hand (one month of the 12) ----
  // players: 0 = 客 (you), 1 = コンピューター. oya plays first.
  function deal(r, oya) {
    for (var tries = 0; tries < 100; tries++) {
      var d = shuffle(r);
      var hands = [[], []], field = [];
      // oya deals: ko, field, oya — two at a time, as is customary (the order does not change the odds)
      var ko = 1 - oya;
      for (var round = 0; round < 4; round++) {
        hands[ko].push(d.pop(), d.pop()); field.push(d.pop(), d.pop()); hands[oya].push(d.pop(), d.pop());
      }
      if (fourOfAMonth(field)) continue;       // four of one month on the table → redeal
      return { hands: hands, field: field, deck: d, cap: [[], []], oya: oya, turn: oya, koi: [0, 0], last: [0, 0], over: false, result: null, log: [] };
    }
    throw new Error("deal failed");
  }
  function byMonth(cards) { var m = {}; cards.forEach(function (id) { var k = month(id); (m[k] = m[k] || []).push(id); }); return m; }
  function fourOfAMonth(cards) { var m = byMonth(cards); return Object.keys(m).some(function (k) { return m[k].length === 4; }); }
  // 手四 (four of a month) / くっつき (four pairs) in a dealt hand: 6 points, the hand ends at once
  function handBonus(hand) {
    var m = byMonth(hand), ks = Object.keys(m);
    if (ks.some(function (k) { return m[k].length === 4; })) return { name: "手四", pts: 6 };
    if (ks.length === 4 && ks.every(function (k) { return m[k].length === 2; })) return { name: "くっつき", pts: 6 };
    return null;
  }
  function matches(field, id) { var mm = month(id); return field.filter(function (f) { return month(f) === mm; }); }
  // what a card captures: [] = nothing (it stays on the table); 1 card; or 3 → all of them. With 2 matches a choice is needed.
  function captureOptions(field, id) {
    var ms = matches(field, id);
    if (ms.length === 0) return [[]];
    if (ms.length === 1 || ms.length === 3) return [ms];
    return ms.map(function (x) { return [x]; });
  }
  function place(state, p, id, take) {   // put card `id` from hand/deck onto the table, capturing `take`
    if (take.length) {
      state.field = state.field.filter(function (f) { return take.indexOf(f) < 0; });
      state.cap[p] = state.cap[p].concat([id], take);
    } else state.field = state.field.concat([id]);
  }
  // one full turn: play hand card `id` capturing `take1`, then draw; `chooseDraw(options)` picks for the drawn card
  function playTurn(state, p, id, take1, chooseDraw) {
    var before = yaku(state.cap[p]).total;
    state.hands[p] = state.hands[p].filter(function (h) { return h !== id; });
    place(state, p, id, take1);
    var drawn = state.deck.pop(), opts = captureOptions(state.field, drawn);
    var take2 = opts.length > 1 ? chooseDraw(drawn, opts) : opts[0];
    place(state, p, drawn, take2);
    state.log.push({ p: p, play: id, take: take1, draw: drawn, take2: take2 });
    var after = yaku(state.cap[p]).total;
    return { drawn: drawn, take2: take2, newYaku: after > before && after > 0, total: after };
  }
  // score when player p stops: ×2 at 7 or more, ×2 again if the opponent had called koi-koi
  function stopScore(state, p) {
    var y = yaku(state.cap[p]).total, mult = 1;
    if (y >= 7) mult *= 2;
    if (state.koi[1 - p]) mult *= 2;
    return { base: y, mult: mult, pts: y * mult };
  }
  function handOver(state) { return state.hands[0].length === 0 && state.hands[1].length === 0; }

  root.Hana = { CARDS: CARDS, MONTHS: MONTHS, card: card, month: month, yaku: yaku, rng: rng, deal: deal, handBonus: handBonus,
    matches: matches, captureOptions: captureOptions, playTurn: playTurn, place: place, stopScore: stopScore, handOver: handOver, ID: ID };
})(typeof window !== "undefined" ? window : globalThis);
if (typeof module !== "undefined") module.exports = globalThis.Hana;

</script>
<script>
// Computer players for こいこい. A level is a set of weights; "kyaku" imitates an ordinary customer.
(function (root) {
  "use strict";
  var H = root.Hana;
  // which named yaku each card helps, and how many cards that yaku needs
  var GROUPS = [
    { name: "光", ids: [0, 8, 28, 40, 44], need: 3, pts: 5 },
    { name: "花見", ids: [8, 32], need: 2, pts: 5 },
    { name: "月見", ids: [28, 32], need: 2, pts: 5 },
    { name: "猪鹿蝶", ids: [20, 24, 36], need: 3, pts: 5 },
    { name: "赤短", ids: [1, 5, 9], need: 3, pts: 5 },
    { name: "青短", ids: [21, 33, 37], need: 3, pts: 5 }
  ];
  var BASE = { H: 4, T: 2, S: 1.6, K: 0.6 };
  function owned(cap) { var o = {}; cap.forEach(function (id) { o[id] = 1; }); return o; }
  function counts(cap) { var c = { T: 0, S: 0, K: 0 }; cap.forEach(function (id) { var k = H.card(id).kind; if (c[k] != null) c[k]++; }); return c; }
  // how much card `id` is worth to player p in this state
  function worth(state, p, id) {
    var mine = owned(state.cap[p]), theirs = owned(state.cap[1 - p]), c = H.card(id), v = BASE[c.kind];
    GROUPS.forEach(function (g) {
      if (g.ids.indexOf(id) < 0) return;
      var have = g.ids.filter(function (x) { return mine[x]; }).length, lost = g.ids.filter(function (x) { return theirs[x]; }).length;
      if (g.ids.length - lost < g.need) return;               // already impossible
      var left = g.need - have;                               // cards still needed (this one included)
      v += g.pts * (left <= 1 ? 1.2 : left === 2 ? 0.55 : 0.3);
    });
    var cn = counts(state.cap[p]);
    if (c.kind === "T" && cn.T >= 3) v += 0.7 * (cn.T - 2);
    if (c.kind === "S" && cn.S >= 3) v += 0.7 * (cn.S - 2);
    if ((c.kind === "K" || id === 32) && cn.K >= 7) v += 0.5 * (cn.K - 6);
    return v;
  }
  function unseen(state, p) {   // cards p cannot see (opponent hand + deck)
    var seen = {}; state.hands[p].concat(state.field, state.cap[0], state.cap[1]).forEach(function (x) { seen[x] = 1; });
    var u = []; for (var i = 0; i < 48; i++) if (!seen[i]) u.push(i); return u;
  }
  function makeAI(level) {
    var L = {
      easy:   { deny: 0.2, risk: 0.3, noise: 2.5, koiBelow: 99, koiCards: 1, tol: 3 },
      kyaku:  { deny: 0.45, risk: 0.6, noise: 1.2, koiBelow: 6, koiCards: 3, tol: 1 },
      normal: { deny: 0.5, risk: 0.8, noise: 0.6, koiBelow: 7, koiCards: 3, tol: 1 },
      strong: { deny: 0.5, risk: 1.0, noise: 0.15, koiBelow: 7, koiCards: 2, tol: 1 }
    }[level] || (typeof level === "object" ? level : null);
    if (!L) throw new Error("unknown level " + level);
    if (typeof level === "object") level = "custom";
    function gain(state, p, take, played) {
      var v = 0, all = take.length ? take.concat([played]) : [];
      all.forEach(function (id) { v += worth(state, p, id) + L.deny * worth(state, 1 - p, id); });
      if (!take.length) {   // the card is left on the table: what could the opponent do with it?
        var u = unseen(state, p), m = H.month(played), same = u.filter(function (x) { return H.month(x) === m; }).length;
        var pOpp = Math.min(1, same * state.hands[1 - p].length / Math.max(1, u.length));
        v -= L.risk * pOpp * (worth(state, 1 - p, played) + 1);
      }
      return v;
    }
    return {
      level: level,
      // returns {id, take}
      choosePlay: function (state, p, r) {
        var best = null;
        state.hands[p].forEach(function (id) {
          H.captureOptions(state.field, id).forEach(function (take) {
            var v = gain(state, p, take, id) + (r() - 0.5) * L.noise;
            if (!best || v > best.v) best = { id: id, take: take, v: v };
          });
        });
        return best;
      },
      chooseDraw: function (state, p, id, opts, r) {
        var best = null;
        opts.forEach(function (take) { var v = gain(state, p, take, id) + (r() - 0.5) * L.noise * 0.5; if (!best || v > best.v) best = { take: take, v: v }; });

      koi: function (state, p, r) {
        var total = H.yaku(state.cap[p]).total, left = state.hands[p].length;
        if (left < L.koiCards || total >= L.koiBelow) return false;
        // danger: how close is the opponent to a yaku?
        var opp = H.yaku(state.cap[1 - p]).total, danger = 0, o = owned(state.cap[1 - p]), mine = owned(state.cap[p]);
        GROUPS.forEach(function (g) {
          var have = g.ids.filter(function (x) { return o[x]; }).length, lost = g.ids.filter(function (x) { return mine[x]; }).length;
          if (g.ids.length - lost >= g.need && g.need - have <= 1) danger++;
        });
        var cn = counts(state.cap[1 - p]); if (cn.T >= 4 || cn.S >= 4 || cn.K >= 9) danger++;
        if (opp > 0) danger += 2;
        return danger <= L.tol;
      }
    };
  }

})(typeof window !== "undefined" ? window : globalThis);

    $("cYaku").textContent = yakuText(s.cap[1]) + (s.koi[1] ? "　こいこい中" : "");
    $("pYaku").textContent = yakuText(s.cap[0]) + (s.koi[0] ? "　こいこい中" : "");
    $("deck").innerHTML = (s.deck.length ? C.back() : "") + '<span class="n">' + s.deck.length + "</span>" + (pd() ? '<div class="drawn">' + C.svg(pd().id) + "</div>" : "");
    var f = $("field"); f.innerHTML = "";
    var myTurn = s.turn === 0 && !busy && !g.over;
    var matchM = sel != null ? H.month(sel) : pd() ? H.month(pd().id) : 0;
    s.field.forEach(function (id) {
      var isMatch = matchM && H.month(id) === matchM;
      var pick = isMatch && ((sel != null && H.captureOptions(s.field, sel).length > 1) || (pd() && pd().opts.length > 1));
      f.appendChild(cardBtn(id, (isMatch ? "match " : "") + (pick ? "pick" : ""), pick ? fieldPick : null, !pick));
    });
    var h = $("hand"); h.innerHTML = "";
    s.hands[0].forEach(function (id) {
      var m = H.matches(s.field, id).length;
      h.appendChild(cardBtn(id, (sel === id ? "sel " : "") + (m && myTurn ? "match" : ""), handClick, !myTurn || !!pd()));
    });
    $("hint").textContent = myTurn && !pd() ? (sel != null ? "取る札を選んでください" : "出す札を選んでください（光っている札は場の札と合います）") : "";
  }
  function msg(t, dim) { $("msg").textContent = t; $("msg").className = "msg" + (dim ? " dim" : ""); }
  function panel(html, buttons) {
    $("box").innerHTML = html + '<div class="btns">' + buttons.map(function (b, i) { return '<button class="btn ' + (b.cls || "") + '" type="button" data-i="' + i + '"' + (b.disabled ? " disabled" : "") + ">" + b.label + "</button>"; }).join("") + "</div>";
    $("panel").hidden = false;
    $("box").querySelectorAll("[data-i]").forEach(function (el) { el.addEventListener("click", function () { $("panel").hidden = true; buttons[+el.dataset.i].go(); }); });
  }

  // ---------- a game of 12 months ----------
  function canStart() { return S.credit >= S.set.rate * (KEEP + S.set.fee); }
  function startPanel() {
    var r = S.set;
    var html = "<h3>勝負の設定</h3>" +
      '<div class="fine" style="text-align:center">1文あたりのポイント</div><div class="chips" id="rateChips">' + RATES.map(function (x) { return '<button class="chip" data-rate="' + x + '" aria-pressed="' + (x === r.rate) + '">' + fmt(x) + "P</button>"; }).join("") + "</div>" +
      '<div class="fine" style="text-align:center">相手の強さ</div><div class="chips" id="lvChips">' + Object.keys(LEVELS).map(function (k) { return '<button class="chip" data-lv="' + k + '" aria-pressed="' + (k === r.level) + '">' + LEVELS[k] + "</button>"; }).join("") + "</div>" +
      '<p class="fine" style="text-align:center">12か月勝負。場代 ' + r.fee + " 文（" + fmt(r.fee * r.rate) + " P）を最初に払います。<br>各月の勝ち点 × " + fmt(r.rate) + " P がその場でやり取りされます。</p>" +
      (canStart() ? "" : '<p class="fine" style="color:#ffb48a;text-align:center">持ち点が足りません（' + fmt(r.rate * (KEEP + r.fee)) + " P 以上必要）</p>");
    panel(html, [{ label: "始める", cls: "gold", disabled: !canStart(), go: startGame }, { label: "やめる", go: function () {} }]);
    $("box").querySelectorAll("[data-rate]").forEach(function (b) { b.addEventListener("click", function () { S.set.rate = +b.dataset.rate; save(); startPanel(); }); });
    $("box").querySelectorAll("[data-lv]").forEach(function (b) { b.addEventListener("click", function () { S.set.level = b.dataset.lv; save(); startPanel(); }); });
  }
  function startGame() {
    if (!canStart()) return;
    var fee = S.set.fee * S.set.rate;
    S.credit -= fee;
    S.g = { rate: S.set.rate, level: S.set.level, fee: S.set.fee, month: 1, score: [0, 0], oya: Math.random() < 0.5 ? 0 : 1, s: null, over: false, paid: fee, got: 0, hist: [] };
    if (!save()) { S.credit += fee; S.g = null; msg("保存できないため始められませんでした"); return; }
    newMonth();
  }
  function newMonth() {
    var g = S.g;
    g.s = H.deal(Math.random, g.oya); g.over = false; sel = null; g.pd = null;
    save(); render();
    msg(g.month + "月　" + (g.oya === 0 ? "あなたが親です" : "コンピューターが親です"));
    for (var q = 0; q < 2; q++) {
      var p = q === 0 ? g.oya : 1 - g.oya, b = H.handBonus(g.s.hands[p]);
      if (b) { return setTimeout(function () { endMonth(p, b.pts, [{ name: b.name, pts: b.pts }], 1, b.name); }, 600); }
    }
    if (g.s.turn === 1) cpuTurn();
  }
  // ---- your turn ----
  function handClick(id) {
    var s = S.g.s; if (busy || s.turn !== 0 || pd()) return;
    var opts = H.captureOptions(s.field, id);
    if (opts.length > 1) { sel = sel === id ? null : id; render(); return; }
    sel = null; doPlay(id, opts[0]);
  }
  function fieldPick(fid) {
    if (pd()) { var d = pd(); S.g.pd = null; finishDraw(d.id, [fid]); return; }
    if (sel == null) return;
    var id = sel; sel = null; doPlay(id, [fid]);
  }
  // the played card and the drawn card are saved together, so a reload can never play twice or lose the draw
  function doPlay(id, take) {
    var g = S.g, s = g.s; busy = true;
    g.before = H.yaku(s.cap[0]).total;
    s.hands[0] = s.hands[0].filter(function (h) { return h !== id; });
    H.place(s, 0, id, take);
    var drawn = s.deck.pop(), opts = H.captureOptions(s.field, drawn);
    g.pd = { id: drawn, opts: opts };
    save(); render();
    if (opts.length > 1) { busy = false; render(); msg("めくった札で取る札を選んでください"); return; }
    setTimeout(function () { g.pd = null; finishDraw(drawn, opts[0]); }, 650);
  }
  function finishDraw(drawn, take) {
    var g = S.g, s = g.s; busy = true; g.pd = null;
    H.place(s, 0, drawn, take);
    var after = H.yaku(s.cap[0]).total;
    g.ask = after > g.before && after > 0 ? { at: Date.now() } : null;   // a new yaku: the stop / koi-koi question is pending
    save(); render();
    finishDrawAsk();
  }
  function finishDrawAsk() {
    var g = S.g, s = g.s;
    if (!g.ask) return nextTurn();
    var last = s.hands[0].length === 0, sc = H.stopScore(s, 0), list = H.yaku(s.cap[0]).list;
    var html = "<h3>役ができました</h3><table>" + list.map(function (y) { return "<tr><td>" + y.name + "</td><td>" + y.pts + " 文</td></tr>"; }).join("") + "</table>" +
      '<p class="fine" style="text-align:center">ここで上がると ' + sc.pts + " 文" + (sc.mult > 1 ? "（" + sc.base + " × " + sc.mult + "）" : "") + "（" + fmt(sc.pts * g.rate) + " P）</p>" +
      (last ? '<p class="fine" style="text-align:center">手札が残っていないので上がります</p>' : '<p class="fine" style="text-align:center">こいこいすると続けて点を伸ばせますが、相手が先に役を作るとその点が倍になります。</p>');
    busy = false;
    panel(html, last ? [{ label: "上がる", cls: "gold", go: function () { g.ask = null; stop(0); } }] :
      [{ label: "上がる", cls: "gold", go: function () { g.ask = null; stop(0); } }, { label: "こいこい", cls: "red", go: function () { s.koi[0] = 1; g.ask = null; save(); msg("こいこい！"); nextTurn(); } }]);
  }
  function finishDraw2() { finishDrawAsk(); }
  function nextTurn() {
    var s = S.g.s; busy = false; S.g.ask = null;
    if (H.handOver(s)) return draw();
    s.turn = 1 - s.turn; save(); render();
    if (s.turn === 1) cpuTurn(); else msg("あなたの番です", true);
  }
  // ---- computer's turn ----
  function cpuTurn() {
    var g = S.g, s = g.s, A = ai(); busy = true; render(); msg("コンピューターの番…", true);
    setTimeout(function () {
      // decide and apply the whole turn first (one save), then show it
      var mv = A.choosePlay(s, 1, Math.random), before = H.yaku(s.cap[1]).total;
      s.hands[1] = s.hands[1].filter(function (h) { return h !== mv.id; });
      H.place(s, 1, mv.id, mv.take);
      var drawn = s.deck.pop(), opts = H.captureOptions(s.field, drawn);
      var take = opts.length > 1 ? A.chooseDraw(s, 1, drawn, opts, Math.random) : opts[0];
      H.place(s, 1, drawn, take);
      var after = H.yaku(s.cap[1]).total, act = "next";
      if (after > before && after > 0) { act = s.hands[1].length > 0 && A.koi(s, 1, Math.random) ? "koi" : "stop"; if (act === "koi") s.koi[1] = 1; }
      s.turn = act === "next" || act === "koi" ? (H.handOver(s) ? 1 : 0) : 1;
      g.cpu = { act: act };
      save(); render();
      msg("コンピューター：「" + H.card(mv.id).name + "」を出し、「" + H.card(drawn).name + "」をめくりました", true);
      setTimeout(function () { cpuAfter(); }, 1100);
    }, 600);
  }
  function cpuAfter() {
    var g = S.g, s = g.s, act = g.cpu ? g.cpu.act : "next"; g.cpu = null; save();
    if (act === "stop") return stop(1);
    if (act === "koi") msg("コンピューター：こいこい！");
    busy = false;
    if (H.handOver(s)) return draw();
    s.turn = 0; save(); render(); if (act !== "koi") msg("あなたの番です", true);
  }
  // ---- end of a month ----
  function stop(p) {
    var s = S.g.s, sc = H.stopScore(s, p), list = H.yaku(s.cap[p]).list.slice();
    if (sc.base >= 7) list.push({ name: "7文以上なので2倍", pts: "×2" });
    if (s.koi[1 - p]) list.push({ name: (p === 0 ? "コンピューター" : "あなた") + "のこいこい中に上がったので2倍", pts: "×2" });
    endMonth(p, sc.pts, list, 1, "上がり");
  }
  function draw() {
    var s = S.g.s;
    if (!s.koi[0] && !s.koi[1]) return endMonth(s.oya, 1, [{ name: "親権", pts: 1 }], 1, "親権");
    endMonth(-1, 0, [], 1, "流れ");
  }
  function endMonth(winner, pts, list, mult, how) {
    var g = S.g; busy = true; g.over = true;
    var moveP = 0;
    if (winner === 0) { moveP = pts * g.rate; S.credit += moveP; g.got += moveP; }
    if (winner === 1) { moveP = Math.min(S.credit, pts * g.rate); S.credit -= moveP; g.paid += moveP; }
    if (winner >= 0) { g.score[winner] += pts; g.oya = winner; }
    g.hist.push({ m: g.month, winner: winner, pts: pts, how: how });
    g.month++; g.s = g.month <= 12 ? g.s : g.s;
    var done = g.month > 12;
    save(); render();
    var who = winner === 0 ? "あなたの勝ち" : winner === 1 ? "コンピューターの勝ち" : "流れ（点なし）";
    var html = "<h3>" + (g.month - 1) + "月　" + who + "</h3>" +
      (list.length ? "<table>" + list.map(function (y) { return "<tr><td>" + y.name + "</td><td>" + y.pts + (typeof y.pts === "number" ? " 文" : "") + "</td></tr>"; }).join("") + (mult > 1 ? "<tr><td>倍付け（7文以上・こいこい返し）</td><td>× " + mult + "</td></tr>" : "") + "</table>" : "") +
      (winner >= 0 ? '<p style="text-align:center;font-size:16px">' + pts + " 文 → " + (winner === 0 ? "+" : "−") + fmt(moveP) + " P</p>" : "") +
      '<p class="fine" style="text-align:center">合計　あなた ' + g.score[0] + " 文　コンピューター " + g.score[1] + " 文</p>";
    panel(html, [{ label: done ? "結果を見る" : "次の月へ", cls: "gold", go: function () { busy = false; if (done) finishGame(); else newMonth(); } }]);
  }
  function finishGame() {
    var g = S.g, net = g.got - g.paid;
    var html = "<h3>12か月の結果</h3><table><tr><td>あなた</td><td>" + g.score[0] + " 文</td></tr><tr><td>コンピューター</td><td>" + g.score[1] + " 文</td></tr>" +
      "<tr><td>場代</td><td>−" + fmt(g.fee * g.rate) + " P</td></tr><tr><td>勝ち点のやり取り</td><td>" + (net >= 0 ? "+" : "−") + fmt(Math.abs(net)) + " P</td></tr></table>" +
      '<p style="text-align:center;font-size:16px">この勝負の収支 ' + (net - g.fee * g.rate >= 0 ? "+" : "−") + fmt(Math.abs(net - g.fee * g.rate)) + " P</p>";
    S.g = null; save(); render(); msg("「勝負を始める」で次の勝負へ", true);
    panel(html, [{ label: "閉じる", cls: "gold", go: function () {} }]);
  }
  $("startBtn").addEventListener("click", startPanel);

  // ---------- rules ----------
  $("rules").innerHTML = '<table>' + [["五光", "光札5枚", 10], ["四光", "雨以外の光札4枚", 8], ["雨四光", "雨を含む光札4枚", 7], ["三光", "雨以外の光札3枚", 5], ["花見で一杯", "桜に幕＋菊に盃", 5], ["月見で一杯", "芒に月＋菊に盃", 5], ["猪鹿蝶", "萩に猪・紅葉に鹿・牡丹に蝶", 5], ["赤短", "松・梅・桜の赤い短冊", 5], ["青短", "牡丹・菊・紅葉の青い短冊", 5], ["赤短・青短の重複", "赤短と青短の両方", 10], ["タネ", "タネ札5枚（1枚増すごとに＋1）", 1], ["タン", "短冊5枚（1枚増すごとに＋1）", 1], ["カス", "カス札10枚（1枚増すごとに＋1。菊に盃もカスに数える）", 1]].map(function (r) { return "<tr><td>" + r[0] + "</td><td class=\"fine\">" + r[1] + "</td><td>" + r[2] + " 文</td></tr>"; }).join("") + "</table>" +
    '<p class="fine">・12か月勝負。各月、手札8枚・場8枚から始めます。同じ月の札で場の札を取ります（2枚合うときは選び、3枚合うときは全部取れます）。<br>・役ができたら「上がる」か「こいこい」を選びます。7文以上は2倍、相手がこいこい中に上がるとさらに2倍。<br>・手札に同じ月が4枚（手四）か、2枚ずつ4組（くっつき）なら、配られた時点で6文。<br>・どちらも上がらずに札がなくなったら、こいこいがなければ親に1文（親権）、こいこいがあれば点なし。<br>・勝った人が次の月の親になります。</p>';

  // ---------- shop settings + expected return (simulation) ----------
  function setupRender() {
    $("setupBody").innerHTML = '<p class="fine">場代（1勝負あたり、文）：<input id="feeIn" type="number" min="0" max="10" step="1" value="' + S.set.fee + '" style="width:4em"> 文</p>' +
      '<div class="btns"><button class="btn" type="button" id="simBtn">店の取り分を試算する（各1,000勝負）</button></div><div class="sim" id="simOut"></div>' +
      '<p class="fine">試算は「ふつうのお客さん」をまねたコンピューターと、選んだ強さのコンピューターを戦わせた結果です。本物のお客さんの腕前で変わります。</p>';
    $("feeIn").addEventListener("change", function () { var v = Math.max(0, Math.min(10, Math.round(+this.value || 0))); S.set.fee = v; this.value = v; save(); });
    $("simBtn").addEventListener("click", runSim);
  }
  function runSim() {
    var out = $("simOut"), btn = $("simBtn"); btn.disabled = true; out.textContent = "計算中…";
    var levels = Object.keys(LEVELS), rows = [], i = 0, N = 1000, fee = S.set.fee;
    (function next() {
      if (i >= levels.length) {
        out.innerHTML = "<table><tr><th>相手</th><th>客の平均収支</th><th>客が勝つ割合</th><th>還元率</th></tr>" + rows.join("") + "</table><p class=\"fine\">還元率 ＝ 客が受け取った点 ÷（客が払った点＋場代）。1勝負＝12か月、場代 " + fee + " 文込み。</p>";
        btn.disabled = false; return;
      }
      var lv = levels[i++], r = H.rng(2026), d = 0, won = 0, got = 0, paid = 0;
      for (var k = 0; k < N; k++) {
        var res = GM.playGame(r, [AI.makeAI("kyaku"), AI.makeAI(lv)], 12);
        var diff = res.score[0] - res.score[1] - fee; d += diff; if (diff > 0) won++;
        res.hist.forEach(function (h) { if (h.winner === 0) got += h.pts; else if (h.winner === 1) paid += h.pts; });
        paid += fee;
      }
      rows.push("<tr><td>" + LEVELS[lv] + "</td><td>" + (d / N >= 0 ? "+" : "") + (d / N).toFixed(1) + " 文</td><td>" + (100 * won / N).toFixed(0) + "%</td><td>" + (100 * got / paid).toFixed(1) + "%</td></tr>");
      setTimeout(next, 20);
    })();
  }
  setupRender();
  $("ver").textContent = VERSION;

  // ---------- resume ----------
  render();
  if (S.g && S.g.s) {
    var g = S.g, s = g.s;
    if (g.over) { if (g.month > 12) finishGame(); else newMonth(); }
    else if (g.cpu) cpuAfter();                                  // the computer's turn was already decided
    else if (g.pd) { if (g.pd.opts.length > 1) { render(); msg("めくった札で取る札を選んでください"); } else { var d0 = g.pd; g.pd = null; finishDraw(d0.id, d0.opts[0]); } }
    else if (g.ask) finishDraw2();
    else if (s.turn === 1) cpuTurn();
    else msg("続きから：あなたの番です", true);
  }
})();

</script>

</body></html>
